<h1>Chapter VII: The Paragons' Charge</h1>

<p>Two banners met.</p>

    
<p>One bore the mark of the divine.</p>

    
<p>Another bore an insatiable thirst for blood.</p>

    
<p>Hope was meant to turn the tide.</p>

    
<p>But the divine filled the battlefield.</p>

    
<p>Despair and vengeance inherited the light.</p>
